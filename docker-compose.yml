services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bisense-db
    environment:
      POSTGRES_USER: bisense
      POSTGRES_PASSWORD: bisense
      POSTGRES_DB: bisense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bisense"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: bisense-api
    environment:
      DATABASE_URL: postgresql+psycopg2://bisense:bisense@postgres:5432/bisense
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      ENV: docker
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

volumes:
  pgdata: